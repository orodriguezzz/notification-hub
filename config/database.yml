# PostgreSQL 18 (se usa uuidv7() nativo).
#
# En local la base corre en Docker (contenedor notification-hub-db, puerto 5436).
# Solid Queue vive en la base principal (outbox transaccional): no hay entrada `queue`.
# `primary_replica` es el rol de lectura; en local apunta a la misma base.
#
# Si existe DATABASE_URL, Rails la combina sobre la configuración `primary`.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5436) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  primary:
    <<: *default
    database: notification_hub_development
  primary_replica:
    <<: *default
    database: notification_hub_development
    replica: true

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary: &primary_test
    <<: *default
    # Los tests de concurrencia usan hasta 10 threads simultáneos
    max_connections: 20
    database: notification_hub_test
  primary_replica:
    <<: *primary_test
    replica: true

# Producción (p. ej. RDS): todo por variables de entorno. Sin réplica real, DATABASE_REPLICA_HOST
# toma el mismo host. RDS exige SSL por defecto; con sslmode "prefer" la conexión usa SSL.
production:
  primary: &primary_production
    <<: *default
    host: <%= ENV["DATABASE_HOST"] %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    database: <%= ENV.fetch("DATABASE_NAME", "notification_hub_production") %>
    sslmode: <%= ENV.fetch("DATABASE_SSLMODE", "prefer") %>
  primary_replica:
    <<: *primary_production
    host: <%= ENV.fetch("DATABASE_REPLICA_HOST") { ENV["DATABASE_HOST"] } %>
    replica: true

# Colas de la central:
#   critical -> categoría critical (documentos firmados)
#   default  -> categoría operational y jobs generales
#   bulk     -> categoría engagement y digest
# El orden de `queues` define la prioridad: un worker toma primero critical, luego default, luego bulk.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ critical, default, bulk ]
      threads: <%= ENV.fetch("JOB_THREADS", 5) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.2
    # Worker dedicado para que las críticas nunca esperen detrás de un lote masivo
    - queues: [ critical ]
      threads: 2
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
